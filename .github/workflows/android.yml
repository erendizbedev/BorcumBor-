name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıkları kur
        run: npm install

      - name: Android projesini oluştur
        run: npx cap add android

      - name: İkon ve açılış ekranını üret
        run: >
          npx capacitor-assets generate --android
          --iconBackgroundColor '#0E1325' --iconBackgroundColorDark '#0E1325'
          --splashBackgroundColor '#0E1325' --splashBackgroundColorDark '#0E1325'

      - name: Web dosyalarını eşitle
        run: npx cap sync android

      - name: APK derle (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK dosyasını hazırla
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BorcumBorc.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BorcumBorc-apk
          path: BorcumBorc.apk

      - name: Sürüm olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son-surum --yes --cleanup-tag || true
          gh release create son-surum BorcumBorc.apk \
            --title "BorcumBorç son sürüm (APK)" \
            --notes "Otomatik derlenen debug APK. Telefonda indirip kurabilirsin. Commit: ${GITHUB_SHA::7}" \
            --prerelease
