<svg xmlns="http://www.w3.org/2000/svg" viewBox="-46 26 340 204" width="340" height="204" role="img" aria-label="BorcumBorç işareti">
<!-- Açılış işareti (geniş görüş alanı: B'ler kenardan kesilmeden kayabilsin; işaret mark.svg ile aynı boyda ve ortada): iki B karşılıklı kayarak gelir, karınlar buluşunca limon bağ alanı belirir, işaret yumuşak bir vuruşla oturur, ardından parıltı halkası yayılır.
     Çizim mark.svg ile aynıdır; son durum varsayılandır, animasyon yalnızca başlangıç karelerini tanımlar (tek sefer, yaklaşık 1,7 sn).
     Zaman çizelgesi: 0-0,9 sn B'ler kayar (transform+opacity), 0,8-1,15 sn limon alan belirir, 0,9-1,4 sn yerine oturma vuruşu, 1,0-1,7 sn parıltı halkası.
     Yalnızca transform ve opacity animasyonlanır. -->
<defs>
  <linearGradient id="v" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A68CFF"/><stop offset="1" stop-color="#6444E6"/></linearGradient>
  <linearGradient id="l" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4FB8E"/><stop offset="1" stop-color="#A6D41C"/></linearGradient>
  <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><path transform="translate(226 42) scale(-1 1)" d="M0 158V14Q0 0 14 0H49A41 41 0 0 1 49 82H0M0 82H55A45 45 0 0 1 55 172H14Q0 172 0 158" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/></mask>
  <style>
    .all,.ba,.glow{transform-box:fill-box;transform-origin:center}
    .all{animation:settle .5s cubic-bezier(.34,1.4,.64,1) .9s both}
    .bl{animation:fromL .9s cubic-bezier(.4,.1,.2,1) 0s both}
    .br{animation:fromR .9s cubic-bezier(.4,.1,.2,1) 0s both}
    .lemon{animation:fade .35s ease-out .8s both}
    .glow{animation:ring .7s cubic-bezier(.16,1,.3,1) 1s both}
    @keyframes fromL{from{opacity:0;transform:translateX(-60px)}}
    @keyframes fromR{from{opacity:0;transform:translateX(60px)}}
    @keyframes fade{from{opacity:0}}
    @keyframes settle{0%{transform:scale(1)}40%{transform:scale(1.035)}100%{transform:scale(1)}}
    @keyframes ring{0%{opacity:0;transform:scale(.8)}15%{opacity:.6}100%{opacity:0;transform:scale(1.45)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.glow{opacity:0}}
  </style>
</defs>
<g class="all">
<g class="ba bl"><path transform="translate(30 42)" d="M0 158V14Q0 0 14 0H49A41 41 0 0 1 49 82H0M0 82H55A45 45 0 0 1 55 172H14Q0 172 0 158" stroke="url(#v)" fill="none" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="ba br"><path transform="translate(226 42) scale(-1 1)" d="M0 158V14Q0 0 14 0H49A41 41 0 0 1 49 82H0M0 82H55A45 45 0 0 1 55 172H14Q0 172 0 158" stroke="url(#v)" fill="none" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="lemon"><g mask="url(#m)"><path transform="translate(30 42)" d="M0 158V14Q0 0 14 0H49A41 41 0 0 1 49 82H0M0 82H55A45 45 0 0 1 55 172H14Q0 172 0 158" stroke="url(#l)" fill="none" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/></g></g>
</g>
<circle class="glow" cx="128" cy="128" r="66" fill="none" stroke="#E4FB8E" stroke-width="3" opacity="0"/>
</svg>
