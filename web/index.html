<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E1325">
  <meta name="color-scheme" content="dark">
  <title>BorcumBorç</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Açılış ekranı: intro.js yönetir. Logo 2,5 sn sabit görünür. -->
  <div id="intro" role="img" aria-label="BorcumBorç açılıyor">
    <div class="intro-stage">
      <img class="intro-mark" alt="" width="160" height="178">
      <div class="intro-word" aria-hidden="true"><span>Borcum</span><span class="b2">Borç</span></div>
    </div>
  </div>

  <!-- Ekran içeriği app.js tarafından #app içine çizilir. Canlı bölge yok: yalnızca #toast ve hata kutuları duyurulur. -->
  <main id="app"></main>
  <noscript><p style="padding:24px">BorcumBorç'ü kullanmak için JavaScript gerekir.</p></noscript>

  <!-- Alt gezinme çubuğu: Ana, Yeni, Onayla, Ayarlar -->
  <nav id="nav" aria-label="Ana gezinme">
    <a href="#/" data-nav="home"><svg class="ic" aria-hidden="true" focusable="false"><use href="assets/icons.svg#ana-sayfa"/></svg><span>Ana</span></a>
    <a href="#/new" data-nav="new"><span class="plus"><svg class="ic" aria-hidden="true" focusable="false"><use href="assets/icons.svg#yeni"/></svg></span><span>Yeni</span></a>
    <a href="#/confirm" data-nav="confirm"><svg class="ic" aria-hidden="true" focusable="false"><use href="assets/icons.svg#onayla"/></svg><span>Onayla</span></a>
    <a href="#/settings" data-nav="settings"><svg class="ic" aria-hidden="true" focusable="false"><use href="assets/icons.svg#ayarlar"/></svg><span>Ayarlar</span></a>
  </nav>
  <div id="toast" role="status"></div>
  <script src="sound.js"></script>
  <script src="native.js"></script>
  <script src="intro.js"></script>
  <script src="app.js"></script>
</body>
</html>
